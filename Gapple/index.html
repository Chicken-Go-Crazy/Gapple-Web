        window.addEventListener("error", event => {
            const error = event.error;
            console.error("Engine startup error: " + (error && error.value != null ? String(error.value) : event.message) + "\n" + (error && error.stack || ""));
        });
        window.addEventListener("unhandledrejection", event => {
            const error = event.reason;
            console.error("Engine asset error: " + (error && error.value != null ? String(error.value) : String(error)) + "\n" + (error && error.stack || ""));
        });
    </script>

    <div id="game-shell">

    <div id="touch-tools">
        <button type="button" id="touch-toggle" role="switch" aria-label="Touch controls" aria-checked="false">TOUCH: OFF</button>

    </div>

        <button type="button" id="touch-dodge" data-key="32" aria-label="Dodge pitchfork" hidden>DODGE</button>

            <button type="button" data-key="27" aria-label="Back">BACK</button>

	<script type="text/javascript">
        // Fullscreen the shared shell: canvas, note buttons and all action controls.
        const shell = document.getElementById('game-shell');
        const fullscreenButton = document.getElementById('touch-fullscreen');
        const landscapeHint = document.getElementById('landscape-hint');
        let wantsLandscape = false;
        let fullscreenBusy = false;
        let largeView = false;
        let fullscreenHint = '';
        const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
        const tapFeedback = document.createElement('div');
        tapFeedback.id = 'tap-feedback';
        tapFeedback.setAttribute('aria-hidden', 'true');
        tapFeedback.setAttribute('inert', '');
        document.body.appendChild(tapFeedback);
        function placeTapFeedback() {
            const parent = fullscreenElement() || document.body;
            if (tapFeedback.parentElement !== parent) parent.appendChild(tapFeedback);
        }
        document.addEventListener('fullscreenchange', placeTapFeedback);
        document.addEventListener('webkitfullscreenchange', placeTapFeedback);
        const heldApples = new Map();
        const visibleApples = new Set();
        const appleReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let appleFrame = 0;
        let appleFrameTime = 0;
        function removeApple(point) {
            point.image.remove();
            visibleApples.delete(point);
            if (heldApples.get(point.id) === point) heldApples.delete(point.id);
        }
        function animateApples(now) {
            appleFrame = 0;
            const dt = Math.min(.05, Math.max(0, (now - appleFrameTime) / 1000));
            appleFrameTime = now;
            const follow = appleReducedMotion.matches ? 1 : 1 - Math.exp(-35 * dt);
            const soften = 1 - Math.exp(-18 * dt);
            const rect = tapFeedback.getBoundingClientRect();
            for (const point of visibleApples) {
                const age = point.released === null ? 0 : (now - point.released) / 450;
                if (age >= 1) { removeApple(point); continue; }
                point.x += (point.targetX - point.x) * follow;
                point.y += (point.targetY - point.y) * follow;
                const speed = Math.hypot(point.vx, point.vy) * Math.exp(-Math.max(0, now - point.moved) / 85);
                const amount = appleReducedMotion.matches || point.released !== null ? 0 : Math.min(.9, speed / 1800);
                point.stretch += (amount - point.stretch) * soften;
                if (speed > 15) {
                    const wanted = Math.atan2(point.vy, point.vx);
                    point.angle += Math.atan2(Math.sin(wanted - point.angle), Math.cos(wanted - point.angle)) * soften;
                }
                const a = point.angle;
                const long = 1 + point.stretch;
                const short = 1 / Math.sqrt(long);
                // Stretch along travel, while keeping the apple upright when it settles.
                const cos = Math.cos(a), sin = Math.sin(a);
                const xx = long * cos * cos + short * sin * sin;
                const yy = long * sin * sin + short * cos * cos;
                const xy = (long - short) * sin * cos;
                point.image.style.transform = `translate3d(${point.x - rect.left}px,${point.y - rect.top}px,0) translate(-50%,-50%) matrix(${xx},${xy},${xy},${yy},0,0)`;
                point.image.style.opacity = String(1 - age);
            }
            if (visibleApples.size) appleFrame = requestAnimationFrame(animateApples);
        }
        function wakeApples() {
            if (appleFrame) return;
            appleFrameTime = performance.now();
            appleFrame = requestAnimationFrame(animateApples);
        }
        document.addEventListener('pointerdown', event => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            const start = document.getElementById('start-screen');
            if (!shell.contains(event.target) && !(start && start.contains(event.target))) return;
            placeTapFeedback();
            if (heldApples.has(event.pointerId)) removeApple(heldApples.get(event.pointerId));
            while (visibleApples.size >= 24) removeApple(visibleApples.values().next().value);
            const image = document.createElement('img');
            image.className = 'golden-apple-tap';
            image.src = './ui/golden-apple-tap.png'; image.alt = ''; image.draggable = false;
            const point = {id:event.pointerId, image, x:event.clientX, y:event.clientY,
                targetX:event.clientX, targetY:event.clientY, vx:0, vy:0,
                moved:performance.now(), angle:0, stretch:0, released:null};
            image.addEventListener('error', () => removeApple(point), {once:true});
            heldApples.set(point.id, point); visibleApples.add(point);
            tapFeedback.appendChild(image); wakeApples();
        }, {capture:true, passive:true});
        document.addEventListener('pointermove', event => {
            const point = heldApples.get(event.pointerId); if (!point) return;
            const now = performance.now(), dt = Math.max(1, now - point.moved) / 1000;
            point.vx = point.vx * .35 + (event.clientX - point.targetX) / dt * .65;
            point.vy = point.vy * .35 + (event.clientY - point.targetY) / dt * .65;
            point.targetX = event.clientX; point.targetY = event.clientY; point.moved = now;
        }, {capture:true, passive:true});
        function releaseApple(event) {
            const point = heldApples.get(event.pointerId); if (!point) return;
            if (event.type === 'pointerup') { point.targetX = event.clientX; point.targetY = event.clientY; }
            point.released = performance.now(); heldApples.delete(event.pointerId);
        }
        document.addEventListener('pointerup', releaseApple, {capture:true, passive:true});
        document.addEventListener('pointercancel', releaseApple, {capture:true, passive:true});
        document.addEventListener('lostpointercapture', releaseApple, {capture:true, passive:true});
        function clearApples() {
            for (const point of visibleApples) removeApple(point);
            heldApples.clear();
            if (appleFrame) cancelAnimationFrame(appleFrame);
            appleFrame = 0;
        }
        window.addEventListener('blur', clearApples);
        document.addEventListener('visibilitychange', () => { if (document.hidden) clearApples(); });

        const standalone = () => navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches;
        const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        function syncViewport() {
            // iOS changes the visible height when browser bars expand or collapse.
            const viewport = window.visualViewport;
            const height = Math.round(viewport ? viewport.height : window.innerHeight);
            shell.style.setProperty('--game-height', height + 'px');
        }
        function updateFullscreenControls() {
            const native = !!fullscreenElement();
            const installed = standalone();
            const active = native || largeView || installed;
            fullscreenButton.textContent = native ? 'EXIT FULLSCREEN' : largeView ? 'EXIT LARGE VIEW' : installed ? 'LANDSCAPE' : 'FULLSCREEN';
            fullscreenButton.setAttribute('aria-pressed', String(active));
            fullscreenButton.setAttribute('aria-label', native ? 'Exit fullscreen' : largeView ? 'Exit large view' : 'Enter fullscreen and landscape');
            const portrait = window.innerHeight > window.innerWidth;
            const messages = [];
            if (wantsLandscape && portrait) messages.push('Rotate your phone sideways.');
            if (fullscreenHint) messages.push(fullscreenHint);
            landscapeHint.textContent = messages.join(' ');
            landscapeHint.hidden = !landscapeHint.textContent;
        }
        function useLargeView() {
            largeView = true;
            shell.classList.add('large-view');
            fullscreenHint = ios
                ? 'For no browser bars: Share → Add to Home Screen, then open the new icon. If the option is missing, open this page in Safari.'
                : 'This browser cannot hide its bars. The game fills the available space.';
        }
        async function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); } catch (_) {}
            }
        }
        fullscreenButton.addEventListener('click', async () => {
            if (fullscreenBusy) return;
            fullscreenBusy = true;
            fullscreenHint = '';
            try {
                if (fullscreenElement()) {
                    wantsLandscape = false;
                    const exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exit) await exit.call(document);
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                } else if (largeView) {
                    wantsLandscape = false;
                    largeView = false;
                    shell.classList.remove('large-view');
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                } else {
                    wantsLandscape = true;
                    if (!standalone()) {
                        const enter = shell.requestFullscreen || shell.webkitRequestFullscreen;
                        if (enter) {
                            try {
                                await enter.call(shell);
                                if (!fullscreenElement()) useLargeView();
                            } catch (_) { useLargeView(); }
                        } else useLargeView();
                    }
                    await lockLandscape();
                }
            } catch (_) { useLargeView(); }
            finally {
                fullscreenBusy = false;
                syncViewport();
                updateFullscreenControls();
                window.dispatchEvent(new Event('resize'));
                const canvas = document.querySelector('#content canvas');
                if (canvas) canvas.focus();
            }
        });
        function fullscreenChanged() {
            if (!fullscreenElement() && !largeView && !standalone()) {
                wantsLandscape = false;
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            }
            syncViewport();
            updateFullscreenControls();
            window.dispatchEvent(new Event('resize'));
        }
        document.addEventListener('fullscreenchange', fullscreenChanged);
        document.addEventListener('webkitfullscreenchange', fullscreenChanged);
        window.addEventListener('resize', () => { syncViewport(); updateFullscreenControls(); });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', () => {
            syncViewport();
            window.dispatchEvent(new Event('resize'));
        });
        syncViewport();
        updateFullscreenControls();

        const potatoMode = document.getElementById('potato-mode');
        const startButton = document.getElementById('start-game');
        const startupStatus = document.getElementById('startup-status');
        try { potatoMode.checked = localStorage.getItem('goldenApple.potatoMode') === 'true' || localStorage.getItem('goldenApple.potatoSprites') === 'true'; } catch (_) {}
        let started = false;
        async function startGame() {
            if (started) return;
            started = true;
            window.goldenPotatoMode = potatoMode.checked;
            try { localStorage.setItem('goldenApple.potatoMode', String(potatoMode.checked)); localStorage.removeItem('goldenApple.potatoSprites'); } catch (_) {}
            potatoMode.disabled = true;
            startButton.disabled = true;
            startButton.textContent = 'Loading...';
            startupStatus.textContent = '';
            try {
                if (typeof Howler !== 'undefined') Howler.volume(1);
                if (typeof Howler !== 'undefined' && Howler.ctx && Howler.ctx.state === 'suspended') {
                    try { await Howler.ctx.resume(); } catch (_) {}
                }
                // Save the sprite choice before loading the engine or its assets.
                if (typeof lime === 'undefined' || typeof lime.embed !== 'function') {
                    await new Promise((resolve, reject) => {
                        const engine = document.createElement('script');
                        engine.src = './Funkin.js';
                        engine.onload = resolve;
                        engine.onerror = () => { engine.remove(); reject(new Error('Could not load the mod. Click to try again.')); };
                        document.head.appendChild(engine);
                    });
                }
                if (typeof Howler !== 'undefined' && Howler.ctx && Howler.ctx.state === 'suspended') {
                    try { Howler.ctx.resume().catch(() => {}); } catch (_) {}
                }
                lime.embed('Funkin', 'content', 1280, 720);
                document.getElementById('start-screen').remove();
                window.removeEventListener('keydown', startKey);
            } catch (error) {
                started = false;
                potatoMode.disabled = false;
                startButton.disabled = false;
                startButton.textContent = 'Click to start';
                startupStatus.textContent = error.message || 'Could not load the mod. Click to try again.';
            }
        }
        function startKey(event) { if (event.key === "Enter") { event.preventDefault(); startGame(); } }
        document.getElementById("start-game").addEventListener("click", startGame);
        window.addEventListener("keydown", startKey);
	</script>

</body>
</html>
